# Cloudflare Workers Builds builds and deploys this worker straight from the
# repo on every push to main. This workflow does not deploy; it only applies
# pending D1 migrations, which Workers Builds does not do on its own.
#
# Both run on the same push, so they race. That is fine while migrations stay
# additive -- the old worker simply ignores new columns for the few seconds
# before the new one goes live. A destructive migration (dropping or renaming
# something live code reads) would need the deploy held until this finishes.
name: Apply D1 migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    name: Migrate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --config wrangler.toml is required, not cosmetic. After a build,
      # .wrangler/deploy/config.json redirects wrangler to
      # build/server/wrangler.json, where migrations_dir resolves relative to
      # build/server/ -- a directory with no migration files. Wrangler then
      # reports "No migrations to apply!" and exits 0, silently applying
      # nothing. Passing the repo config explicitly avoids that.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply social_rpg_db --remote --config wrangler.toml
